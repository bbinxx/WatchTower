service: watchtower
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    NODE_ENV: production

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi: '*'

  cron:
    handler: src/cron.handler
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true
