services:
  - type: web
    name: watchtower-web
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: cron
    name: watchtower-cron
    env: node
    buildCommand: npm install
    startCommand: node src/cron.js
    schedule: "*/1 * * * *"
    envVars:
      - key: NODE_ENV
        value: production
