<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchTower - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center transition-colors duration-300">
    <div class="bg-white dark:bg-darkCard p-8 rounded-xl shadow-2xl w-full max-w-md transform transition-all">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2">WatchTower</h1>
            <p class="text-gray-500 dark:text-gray-400">Sign in to your monitoring dashboard</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="admin@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="••••••••">
            </div>
            
            <div id="errorMsg" class="text-red-500 text-sm hidden bg-red-100 dark:bg-red-900/30 p-3 rounded"></div>
            
            <button type="submit" id="loginBtn" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg hover:shadow-xl flex justify-center items-center">
                <span>Sign In</span>
            </button>

            <div class="text-center mt-4">
                <button type="button" id="toggleModeBtn" class="text-primary hover:underline text-sm font-medium">
                    Don't have an account? Sign up
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Check theme
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        async function initFirebase() {
            try {
                const res = await fetch('/api/firebase-config');
                const config = await res.json();
                
                if (Object.keys(config).length === 0) {
                    const errorMsg = document.getElementById('errorMsg');
                    errorMsg.textContent = 'Firebase is not configured on the server. Please add FIREBASE_PUBLIC_CONFIG to your .env file.';
                    errorMsg.classList.remove('hidden');
                    return null;
                }
                
                const app = initializeApp(config);
                return getAuth(app);
            } catch (err) {
                console.error("Failed to load Firebase config", err);
                return null;
            }
        }

        const authPromise = initFirebase();
        
        let isLoginMode = true;
        
        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            const btn = document.getElementById('loginBtn');
            const toggleBtn = document.getElementById('toggleModeBtn');
            const title = document.querySelector('h1');
            const subtitle = document.querySelector('.text-gray-500');
            
            if (isLoginMode) {
                title.textContent = 'WatchTower';
                subtitle.textContent = 'Sign in to your monitoring dashboard';
                btn.querySelector('span').textContent = 'Sign In';
                toggleBtn.textContent = "Don't have an account? Sign up";
            } else {
                title.textContent = 'Create Account';
                subtitle.textContent = 'Join WatchTower monitoring';
                btn.querySelector('span').textContent = 'Sign Up';
                toggleBtn.textContent = 'Already have an account? Sign in';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.querySelector('span').textContent = isLoginMode ? 'Signing in...' : 'Signing up...';

            try {
                const auth = await authPromise;
                if (!auth) throw new Error('Firebase Auth not initialized');

                let userCredential;
                if (isLoginMode) {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } else {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                }
                
                const idToken = await userCredential.user.getIdToken();
                
                // Send token to backend to create session cookie
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: idToken })
                });

                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    throw new Error(data.error || 'Authentication failed on server');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.querySelector('span').textContent = isLoginMode ? 'Sign In' : 'Sign Up';
            }
        });
    </script>
</body>
</html>
