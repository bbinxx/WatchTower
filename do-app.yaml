name: watchtower
region: nyc
services:
  - name: watchtower-web
    # Adjust the github repo settings when deploying
    github:
      repo: your-username/watchtower
      branch: main
    build_command: npm install
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    envs:
      - key: NODE_ENV
        value: production
      # Add FIREBASE_SERVICE_ACCOUNT and FIREBASE_PUBLIC_CONFIG via DigitalOcean Dashboard
